
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 학교 주변 무료 문화시설 찾기</title>

    <style>
        /* 기본 페이지 설정 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans KR", sans-serif;
            color: #222;
        }

        /* 왼쪽 목록과 오른쪽 지도를 가로로 배치 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 패널 */
        .sidebar {
            width: 360px;
            min-width: 300px;
            padding: 24px;
            overflow-y: auto;
            border-right: 1px solid #eee;
            background-color: #fff;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 23px;
            line-height: 1.4;
        }

        .description {
            margin-bottom: 20px;
            color: #777;
            font-size: 13px;
            line-height: 1.7;
        }

        /* 학교와 문화시설 탭 */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-button {
            flex: 1;
            padding: 12px 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .tab-button.active {
            border-color: #fee500;
            background-color: #fee500;
        }

        .tab-button:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        /* 현재 위치 안내 */
        .location-info {
            margin-bottom: 16px;
            padding: 12px;
            border-radius: 8px;
            background-color: #f7f7f7;
            color: #555;
            font-size: 12px;
            line-height: 1.6;
        }

        /* 검색 진행 상태 */
        #status {
            margin: 14px 0;
            color: #555;
            font-size: 13px;
            line-height: 1.6;
        }

        /* 결과 목록과 구분 제목 */
        #resultList {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .section-title {
            margin: 22px 0 8px;
            padding-bottom: 8px;
            border-bottom: 2px solid #eee;
            font-size: 15px;
            font-weight: bold;
        }

        .result-item {
            padding: 14px 6px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .result-item:hover {
            background-color: #fffbea;
        }

        .place-name {
            margin-bottom: 6px;
            font-size: 15px;
            font-weight: bold;
        }

        .place-category {
            margin-bottom: 5px;
            color: #888;
            font-size: 11px;
            line-height: 1.5;
        }

        .place-address {
            color: #555;
            font-size: 12px;
            line-height: 1.6;
        }

        .empty-message {
            padding: 12px 4px;
            color: #888;
            font-size: 13px;
            line-height: 1.6;
        }

        /* 오른쪽 지도 */
        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background-color: #f2f2f2;
        }

        /* 모바일 화면에서는 위아래로 배치 */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
                height: 100dvh;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 48%;
                padding: 16px;
                border-right: none;
                border-bottom: 1px solid #eee;
            }

            #map {
                width: 100%;
                height: 52%;
                min-height: 180px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽 탭과 장소 목록 -->
        <aside class="sidebar">
            <h1>우리 학교 주변 문화시설</h1>

            <p class="description">
                학교와 주변 문화시설을 찾아보세요.<br>
                장소를 누르면 지도에서 위치를 확인할 수 있어요.
            </p>

            <!-- 검색할 장소 종류를 선택하는 탭 -->
            <div class="tabs">
                <button
                    type="button"
                    class="tab-button active"
                    id="schoolTab"
                    data-category="SC4"
                    disabled
                >
                    학교
                </button>

                <button
                    type="button"
                    class="tab-button"
                    id="cultureTab"
                    data-category="CT1"
                    disabled
                >
                    문화시설
                </button>
            </div>

            <div class="location-info" id="locationInfo">
                현재 위치를 확인하고 있습니다.
            </div>

            <p id="status" role="status" aria-live="polite">
                카카오맵을 불러오는 중입니다.
            </p>

            <ul id="resultList"></ul>
        </aside>

        <!-- 오른쪽 지도 -->
        <div id="map" aria-label="학교 및 문화시설 지도"></div>

    </div>

    <script>
        // 기본 위치는 서울시청으로 설정
        const defaultLatitude = 37.5665;
        const defaultLongitude = 126.9780;

        // 검색에 사용할 기본 설정
        const searchRadius = 3000;
        const maxSchoolCountForCultureSearch = 5;

        // 지도와 검색 기능에서 사용할 변수
        let map = null;
        let placesService = null;
        let infoWindow = null;
        let currentMarker = null;
        let currentPosition = null;
        let isMapReady = false;
        let activeCategory = "SC4";
        let searchSessionId = 0;

        // 장소 마커와 문화시설 중복 확인에 사용할 배열
        let placeMarkers = [];
        let culturePlaceIds = new Set();

        // HTML 요소를 변수로 저장
        const schoolTab = document.getElementById("schoolTab");
        const cultureTab = document.getElementById("cultureTab");
        const locationInfo = document.getElementById("locationInfo");
        const statusText = document.getElementById("status");
        const resultList = document.getElementById("resultList");

        // 카카오 SDK 로드가 완료된 뒤 지도 초기화
        function loadKakaoMap() {
            if (!window.kakao || !window.kakao.maps) {
                showSdkError();
                return;
            }

            // 지도 API 준비가 끝난 후 지도 객체 생성
            kakao.maps.load(function () {
                initializeMap();
            });
        }

        // 지도와 장소 검색 기능 초기화
        function initializeMap() {
            try {
                const mapContainer = document.getElementById("map");

                // 기본 위치를 중심으로 지도를 생성
                map = new kakao.maps.Map(mapContainer, {
                    center: new kakao.maps.LatLng(
                        defaultLatitude,
                        defaultLongitude
                    ),
                    level: 5
                });

                // 카카오 장소 검색 서비스 생성
                placesService = new kakao.maps.services.Places(map);

                // 마커를 누르면 장소 정보를 보여줄 창 생성
                infoWindow = new kakao.maps.InfoWindow({
                    zIndex: 10
                });

                // 지도의 타일이 처음 로드되면 검색 기능 활성화
                kakao.maps.event.addListener(
                    map,
                    "tilesloaded",
                    function () {
                        if (isMapReady) {
                            return;
                        }

                        isMapReady = true;

                        schoolTab.disabled = false;
                        cultureTab.disabled = false;

                        statusText.textContent =
                            "지도가 준비되었습니다.";

                        // 지도가 준비된 후 현재 위치 확인
                        requestCurrentLocation();
                    }
                );

                // 창 크기가 바뀌면 지도의 크기를 다시 계산
                window.addEventListener("resize", function () {
                    if (map) {
                        map.relayout();
                    }
                });

            } catch (error) {
                console.error("지도 초기화 오류:", error);

                statusText.textContent =
                    "지도를 초기화하지 못했습니다. API 설정을 확인해 주세요.";
            }
        }

        // 현재 위치 권한을 요청
        function requestCurrentLocation() {
            if (!navigator.geolocation) {
                locationInfo.textContent =
                    "위치 정보를 지원하지 않아 서울시청을 기준으로 검색합니다.";

                useDefaultLocation();
                return;
            }

            locationInfo.textContent =
                "현재 위치 권한을 확인하고 있습니다.";

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    // 브라우저에서 받은 현재 위치 좌표 저장
                    currentPosition = new kakao.maps.LatLng(
                        position.coords.latitude,
                        position.coords.longitude
                    );

                    // 현재 위치로 지도 중심 이동
                    map.setCenter(currentPosition);
                    map.setLevel(5);

                    // 현재 위치 마커 표시
                    if (currentMarker) {
                        currentMarker.setMap(null);
                    }

                    currentMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition,
                        title: "현재 위치"
                    });

                    locationInfo.textContent =
                        "현재 위치를 기준으로 반경 3km를 검색합니다.";

                    // 위치를 확인한 후 선택된 탭의 검색 실행
                    searchCategory(activeCategory);
                },

                function (error) {
                    // 위치를 사용할 수 없을 때 기본 위치로 대체
                    let message =
                        "현재 위치를 확인하지 못했습니다.";

                    if (error.code === error.PERMISSION_DENIED) {
                        message =
                            "위치 권한이 거부되었습니다.";
                    } else if (
                        error.code === error.POSITION_UNAVAILABLE
                    ) {
                        message =
                            "현재 위치 정보를 사용할 수 없습니다.";
                    } else if (error.code === error.TIMEOUT) {
                        message =
                            "위치 확인 시간이 초과되었습니다.";
                    }

                    locationInfo.textContent =
                        message + " 서울시청을 기준으로 검색합니다.";

                    useDefaultLocation();
                },

                {
                    enableHighAccuracy: false,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 위치 확인에 실패하면 서울시청을 검색 기준으로 사용
        function useDefaultLocation() {
            currentPosition = new kakao.maps.LatLng(
                defaultLatitude,
                defaultLongitude
            );

            map.setCenter(currentPosition);
            map.setLevel(5);

            if (currentMarker) {
                currentMarker.setMap(null);
            }

            currentMarker = new kakao.maps.Marker({
                map: map,
                position: currentPosition,
                title: "기본 위치: 서울시청"
            });

            searchCategory(activeCategory);
        }

        // 두 탭의 클릭 이벤트 등록
        schoolTab.addEventListener("click", function () {
            switchTab("SC4");
        });

        cultureTab.addEventListener("click", function () {
            switchTab("CT1");
        });

        // 탭을 바꾸고 이전 결과를 초기화
        function switchTab(categoryCode) {
            if (!isMapReady) {
                return;
            }

            activeCategory = categoryCode;

            schoolTab.classList.toggle(
                "active",
                categoryCode === "SC4"
            );

            cultureTab.classList.toggle(
                "active",
                categoryCode === "CT1"
            );

            // 이전 검색 요청의 결과가 뒤늦게 도착해도 무시
            searchSessionId++;

            // 이전 결과 목록과 장소 마커 제거
            clearResults();

            // 새 카테고리 검색
            searchCategory(categoryCode);
        }

        // 선택한 카테고리의 장소 검색
        function searchCategory(categoryCode) {
            if (!isMapReady || !placesService || !currentPosition) {
                return;
            }

            // 검색 요청을 구분하는 번호
            const sessionId = ++searchSessionId;

            clearResults();

            statusText.textContent =
                categoryCode === "SC4"
                    ? "주변 학교를 검색하고 있습니다."
                    : "주변 문화시설을 검색하고 있습니다.";

            // 현재 위치를 중심으로 반경 3km 이내 검색
            const searchOptions = {
                location: currentPosition,
                radius: searchRadius,
                sort: kakao.maps.services.SortBy.DISTANCE
            };

            placesService.categorySearch(
                categoryCode,
                function (data, status) {
                    // 탭이 바뀌었다면 이전 검색 결과를 사용하지 않음
                    if (sessionId !== searchSessionId) {
                        return;
                    }

                    if (
                        status !== kakao.maps.services.Status.OK
                    ) {
                        if (
                            status ===
                            kakao.maps.services.Status.ZERO_RESULT
                        ) {
                            statusText.textContent =
                                "반경 3km 안에 검색 결과가 없습니다.";
                        } else {
                            statusText.textContent =
                                "검색에 실패했습니다. 잠시 후 다시 시도해 주세요.";
                        }

                        return;
                    }

                    if (categoryCode === "SC4") {
                        // 학교 목록을 표시하고 주변 문화시설도 검색
                        displaySection(
                            "주변 학교",
                            data,
                            "school"
                        );

                        statusText.textContent =
                            "학교 " + data.length +
                            "곳을 찾았습니다. 주변 문화시설도 확인합니다.";

                        // 학교가 있는 위치 주변의 문화시설 검색
                        searchCultureNearSchools(
                            data,
                            sessionId
                        );

                    } else {
                        // 문화시설 탭에서는 문화시설만 표시
                        displaySection(
                            "주변 문화시설",
                            data,
                            "culture"
                        );

                        statusText.textContent =
                            "문화시설 " + data.length +
                            "곳을 찾았습니다.";
                    }
                },
                searchOptions
            );
        }

        // 학교 주변의 문화시설을 자동 검색
        function searchCultureNearSchools(schools, sessionId) {
            if (schools.length === 0) {
                statusText.textContent =
                    "주변 학교를 찾지 못했습니다.";
                return;
            }

            // 검색 요청 수가 너무 많아지지 않도록 가까운 학교 최대 5곳 사용
            const targetSchools = schools.slice(
                0,
                maxSchoolCountForCultureSearch
            );

            // 각 학교의 검색 결과가 도착할 때까지 개수 확인
            let completedCount = 0;
            let totalCultureCount = 0;

            targetSchools.forEach(function (school) {
                const schoolPosition = new kakao.maps.LatLng(
                    Number(school.y),
                    Number(school.x)
                );

                // 해당 학교를 중심으로 반경 3km 검색
                placesService.categorySearch(
                    "CT1",
                    function (data, status) {
                        // 다른 탭으로 이동했다면 결과를 표시하지 않음
                        if (sessionId !== searchSessionId) {
                            return;
                        }

                        completedCount++;

                        if (
                            status ===
                            kakao.maps.services.Status.OK
                        ) {
                            const uniquePlaces = data.filter(
                                function (place) {
                                    // 이미 추가한 문화시설은 중복 표시하지 않음
                                    if (
                                        culturePlaceIds.has(place.id)
                                    ) {
                                        return false;
                                    }

                                    culturePlaceIds.add(place.id);
                                    return true;
                                }
                            );

                            if (uniquePlaces.length > 0) {
                                displaySection(
                                    "학교 주변 문화시설",
                                    uniquePlaces,
                                    "culture",
                                    true
                                );

                                totalCultureCount +=
                                    uniquePlaces.length;
                            }
                        }

                        // 모든 학교의 문화시설 검색이 끝난 경우
                        if (
                            completedCount === targetSchools.length
                        ) {
                            statusText.textContent =
                                "학교 " + schools.length +
                                "곳과 주변 문화시설 " +
                                totalCultureCount +
                                "곳을 표시했습니다.";

                            if (totalCultureCount === 0) {
                                statusText.textContent +=
                                    " 주변 문화시설을 찾지 못했습니다.";
                            }
                        }
                    },
                    {
                        location: schoolPosition,
                        radius: searchRadius,
                        sort: kakao.maps.services.SortBy.DISTANCE
                    }
                );
            });
        }

        // 검색 결과를 목록과 지도 마커에 표시
        function displaySection(
            title,
            places,
            placeType,
            append = false
        ) {
            if (!append) {
                // 첫 번째 결과 섹션이면 목록을 새로 작성
                resultList.replaceChildren();
            }

            // 결과를 구분하는 제목 생성
            const sectionTitle = document.createElement("li");
            sectionTitle.className = "section-title";
            sectionTitle.textContent = title;

            resultList.appendChild(sectionTitle);

            if (places.length === 0) {
                const emptyItem = document.createElement("li");
                emptyItem.className = "empty-message";
                emptyItem.textContent =
                    "검색된 장소가 없습니다.";

                resultList.appendChild(emptyItem);
                return;
            }

            places.forEach(function (place) {
                const position = new kakao.maps.LatLng(
                    Number(place.y),
                    Number(place.x)
                );

                // 목록 항목 생성
                const listItem = document.createElement("li");
                listItem.className = "result-item";

                const name = document.createElement("div");
                name.className = "place-name";
                name.textContent = place.place_name;

                const category = document.createElement("div");
                category.className = "place-category";
                category.textContent =
                    place.category_name || title;

                const address = document.createElement("div");
                address.className = "place-address";
                address.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    "주소 정보 없음";

                listItem.append(name, category, address);

                // 목록을 누르면 해당 장소의 위치로 이동
                listItem.addEventListener("click", function () {
                    selectPlace(place, position);
                });

                resultList.appendChild(listItem);

                // 지도에 장소 마커 추가
                const marker = new kakao.maps.Marker({
                    map: map,
                    position: position,
                    title: place.place_name
                });

                // 마커 클릭 시 장소 이름과 주소 표시
                kakao.maps.event.addListener(
                    marker,
                    "click",
                    function () {
                        selectPlace(place, position);
                    }
                );

                placeMarkers.push(marker);
            });
        }

        // 장소를 선택하면 지도와 정보 창 갱신
        function selectPlace(place, position) {
            map.panTo(position);
            map.setLevel(5);

            // 주소는 도로명 주소를 우선 사용
            const address =
                place.road_address_name ||
                place.address_name ||
                "주소 정보 없음";

            // HTML 요소를 만들어 안전하게 정보 창에 표시
            const content = document.createElement("div");

            content.style.padding = "10px";
            content.style.minWidth = "150px";
            content.style.maxWidth = "240px";
            content.style.fontSize = "13px";
            content.style.lineHeight = "1.6";

            const nameElement = document.createElement("strong");
            nameElement.textContent = place.place_name;

            const addressElement = document.createElement("div");
            addressElement.textContent = address;

            content.append(nameElement, addressElement);

            infoWindow.setContent(content);
            infoWindow.open(map, findMarker(position, place.place_name));
        }

        // 선택한 장소에 해당하는 마커 찾기
        function findMarker(position, placeName) {
            return placeMarkers.find(function (marker) {
                return (
                    marker.getTitle() === placeName &&
                    marker.getPosition().equals(position)
                );
            });
        }

        // 이전 검색 결과를 모두 삭제
        function clearResults() {
            resultList.replaceChildren();

            placeMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            placeMarkers = [];
            culturePlaceIds.clear();

            if (infoWindow) {
                infoWindow.close();
            }
        }

        // SDK 로딩 실패 시 안내
        function showSdkError() {
            const statusElement =
                document.getElementById("status");

            statusElement.textContent =
                "카카오맵을 불러오지 못했습니다. JavaScript 키, 웹 도메인 등록, 인터넷 연결을 확인해 주세요.";

            schoolTab.disabled = true;
            cultureTab.disabled = true;
        }
    </script>
